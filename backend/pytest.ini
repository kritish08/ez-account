[pytest]
asyncio_mode = auto
# Session-scoped loop because Motor binds its client to the loop that
# was running at import time. Per-function loops cause "Event loop is
# closed" the moment a test reuses the module-level db handle.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
filterwarnings =
    ignore::DeprecationWarning:fido2.*
    ignore::DeprecationWarning:passlib.*
