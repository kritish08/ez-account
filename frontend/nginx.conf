server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files the build step produced. Without this nginx
    # re-compresses every asset on every request at the default level 1,
    # which is both slower and a worse ratio than the level-9 files baked
    # into the image.
    gzip_static on;

    # Fallback for anything not pre-compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/wasm
        image/svg+xml;

    # index.html must never be cached. Its name has no content hash, so a
    # cached copy pins the browser to the previous bundle after a deploy and
    # the new hashed assets are never requested. This has to come BEFORE the
    # generic static-asset rule to win.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # React Router: serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively — every filename carries a content
    # hash, so a changed file is a changed URL.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Source maps are not generated for production builds, but refuse them
    # explicitly so a stray one can never be served.
    location ~* \.map$ {
        return 404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
