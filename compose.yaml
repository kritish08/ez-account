# ============================================================
# EZ Account — Production Compose (Docker 29.x)
# Ubuntu 24.04 / Azure VM / Traefik reverse proxy
# File: compose.yaml  (Docker v2 default — no -f flag needed)
# ============================================================
# Usage:
#   docker compose up -d --build

# Pin the project name so images are always built as `ez-account-*`,
# regardless of which directory the compose is run from (avoids the
# worktree-dir-name leaking into image names like
# `elated-lewin-eb9310-backend`).
name: ez-account

services:
  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ez-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - CORS_ORIGINS=https://ezaccounts.zerp.me
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ez-api.rule=Host(`api-ezaccounts.zerp.me`)"
      - "traefik.http.routers.ez-api.entrypoints=websecure"
      - "traefik.http.routers.ez-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.ez-api.loadbalancer.server.port=8001"
      - "traefik.docker.network=n8n-singh_default"
    networks:
      - traefik_net
    volumes:
      # Persist uploaded files (invoice attachments, etc.)
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/auth/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # React Frontend (Nginx Production Build)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into JS bundle at build time — must be the public API URL
        REACT_APP_BACKEND_URL: https://api-ezaccounts.zerp.me
    container_name: ez-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ez-web.rule=Host(`ezaccounts.zerp.me`)"
      - "traefik.http.routers.ez-web.entrypoints=websecure"
      - "traefik.http.routers.ez-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.ez-web.loadbalancer.server.port=80"
      - "traefik.docker.network=n8n-singh_default"
    networks:
      - traefik_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─────────────────────────────────────────────
  # Daily Encrypted S3 Backup
  # Runs daily at 2 AM UTC via cron.
  # Connects directly to MongoDB Atlas — no login credentials needed.
  # S3 config is read from the app's settings collection (configure once in app UI).
  # ─────────────────────────────────────────────
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: ez-backup
    restart: unless-stopped
    env_file:
      - ./backend/.env   # Provides: MONGO_URL, DB_NAME, MASTER_ENCRYPTION_KEY
    depends_on:
      - backend
    networks:
      - traefik_net

# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  uploads_data:

# ─────────────────────────────────────────────
# Networks — attach to existing Traefik network
# ─────────────────────────────────────────────
networks:
  traefik_net:
    name: n8n-singh_default
    external: true
