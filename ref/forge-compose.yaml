services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: forge-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # MongoDB Atlas connection string will be provided via .env
      - CORS_ORIGINS=https://${DOMAIN_NAME},https://www.${DOMAIN_NAME}
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.forge-api.rule=Host(`api-${DOMAIN_NAME}`)'
      - "traefik.http.routers.forge-api.entrypoints=websecure"
      - "traefik.http.routers.forge-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.forge-api.loadbalancer.server.port=8001"
      - "traefik.docker.network=n8n-singh_default"
    networks:
      - traefik_net
    command: uvicorn server:app --host 0.0.0.0 --port 8001

  # React Frontend (Nginx Production Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: forge-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    labels:
      - "traefik.enable=true"
      - 'traefik.http.routers.forge-web.rule=Host(`${DOMAIN_NAME}`) || Host(`www.${DOMAIN_NAME}`)'
      - "traefik.http.routers.forge-web.entrypoints=websecure"
      - "traefik.http.routers.forge-web.tls.certresolver=mytlschallenge"
      - "traefik.http.services.forge-web.loadbalancer.server.port=80"
      - "traefik.docker.network=n8n-singh_default"
    depends_on:
      - backend
    networks:
      - traefik_net

  # Automated Daily AWS S3 MongoDB Backups
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: forge-backup
    restart: unless-stopped
    # Ensure MONGO_URL, S3_BUCKET, and AWS_REGION are in backend/.env, 
    # or duplicate them here if you prefer a separate backup/.env
    env_file:
      - ./backend/.env

networks:
  traefik_net:
    name: n8n-singh_default
    external: true